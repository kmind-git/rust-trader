name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build (musl static)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$VER" = "main" ] || [ "$VER" = "$GITHUB_REF_NAME" ] && VER="${GITHUB_REF_NAME#v}"
          D="rust-trader-${VER}-linux-x86_64"
          mkdir -p "dist/${D}/systemd"
          cp target/x86_64-unknown-linux-musl/release/exchange "dist/${D}/"
          cp -r configs "dist/${D}/configs"
          cp deploy/rust-trader.service "dist/${D}/systemd/"
          cp DEPLOY.md "dist/${D}/"
          tar czf "dist/${D}.tar.gz" -C dist "${D}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
